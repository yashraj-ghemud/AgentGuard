name: CI

on:
  push:
    branches: [ main, integration, 'feature/**', 'hackathon-hardening' ]
  pull_request:
    branches: [ main, integration ]

jobs:
  backend-lint:
    name: Backend Correctness Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements-dev.txt
      - name: Run Ruff on touched evaluation code
        run: |
          cd Backend
          ruff check \
            modules/evaluation/application/grounding.py \
            modules/evaluation/application/evaluator.py \
            modules/evaluation/domain/schemas.py \
            modules/evaluation/interface/routes.py \
            tests/test_grounding.py \
            --select E9,F
      - name: Compile touched backend code
        run: |
          python -m compileall -q Backend/modules/evaluation Backend/tests/test_grounding.py

  backend-legacy-style:
    name: Backend Legacy Style Debt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements-dev.txt
      - name: Report existing Ruff and Black debt
        run: |
          cd Backend
          ruff check . || true
          black --check . || true

  backend-typecheck:
    name: Backend Type Check (touched code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements-dev.txt
      - name: Run MyPy with explicit package roots
        run: |
          cd Backend
          mypy --explicit-package-bases --ignore-missing-imports --follow-imports=skip \
            modules/evaluation/application/grounding.py \
            modules/evaluation/application/evaluator.py \
            modules/evaluation/domain/schemas.py \
            modules/evaluation/interface/routes.py \
            tests/test_grounding.py

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard
          POSTGRES_DB: agentguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://agentguard:agentguard@localhost:5432/agentguard_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENCRYPTION_KEY: test-encryption-key-32-chars!!
        run: |
          cd Backend
          pytest tests/ --cov=core --cov=modules --cov=shared --cov-report=term-missing

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd Frontend
          npm ci
      - name: Run ESLint
        run: |
          cd Frontend
          npm run lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd Frontend
          npm ci
      - name: Type check
        run: |
          cd Frontend
          npm run type-check

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd Frontend
          npm ci
      - name: Build
        run: |
          cd Frontend
          npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
