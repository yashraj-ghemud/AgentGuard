services:
  - type: web
    runtime: docker
    name: agentguard-backend
    plan: free
    region: oregon
    repo: https://github.com/yashraj-ghemud/AgentGuard
    branch: main
    rootDir: Backend
    dockerCommand: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AgentGuard
      - key: API_HOST
        value: 0.0.0.0
      - key: API_RELOAD
        value: "false"
      - key: FRONTEND_URL
        value: https://agentguard-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: agentguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agentguard-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://agentguard-frontend.onrender.com"]'
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    runtime: docker
    name: agentguard-frontend
    plan: free
    region: oregon
    repo: https://github.com/yashraj-ghemud/AgentGuard
    branch: main
    rootDir: Frontend
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://agentguard-backend-y9fq.onrender.com

  - type: keyvalue
    name: agentguard-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: agentguard-db
    plan: free
    region: oregon
    databaseName: agentguard
    user: agentguard
